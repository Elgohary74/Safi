{% extends "base.html" %}

{% block title %}Safi - Settings{% endblock %}

{% block header %}
<header class="page-header">
    <h2 class="page-title">Account Settings</h2>
</header>
{% endblock %}

{% block content %}
<div class="grid grid-cols-2 gap-8">
    <div class="card">
        <h3 class="section-title mb-4 border-b pb-2">Profile Details</h3>
        <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-2xl">👤</div>
            <div class="flex-1">
                <label class="form-label">Profile Picture</label>
                <div class="relative">
                    <select class="auth-input appearance-none cursor-pointer">
                        <option value="avatar1">Default Avatar</option>
                        <option value="avatar2">Uploaded Photo</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <i class="fas fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="space-y-4">
            <div>
                <label class="form-label">Full Name</label>
                <input type="text" class="auth-input" value="Omar Badran">
            </div>
            <div>
                <label class="form-label">Email Address</label>
                <input type="email" class="auth-input" value="s-omar.shehta@zewailcity.edu.eg">
            </div>
            <div>
                <label class="form-label">Phone Number</label>
                <input type="tel" class="auth-input" value="+20 xxxxxxxxxx">
            </div>
            <button class="btn btn-primary w-full mt-4">Save Changes</button>
        </div>
    </div>

    <div class="card">
        <h3 class="section-title mb-4 border-b pb-2">Payment Methods</h3>
        <div class="space-y-3 mb-6">
            <div class="flex items-center justify-between p-3 border rounded-xl bg-gray-50">
                <div class="flex items-center gap-3">
                    <i class="fab fa-cc-visa text-blue-800 text-xl"></i>
                    <div>
                        <p class="text-sm font-bold">Visa ending in 4242</p>
                        <p class="text-muted-sm">Expires 12/25</p>
                    </div>
                </div>
                <button class="text-red-500 text-xs font-bold hover:underline">Remove</button>
            </div>
        </div>
        <button class="w-full border-2 border-dashed border-gray-300 text-gray-500 py-3 rounded-xl font-bold text-sm hover:bg-gray-50 transition">
            + Add Method
        </button>
    </div>
</div>
{% endblock %}
