{% extends "base.html" %}

{% block title %}Safi - Contact Us{% endblock %}

{% block header %}
<header class="page-header">
    <h2 class="page-title">Contact Us</h2>
</header>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card">
        <h3 class="text-xl font-bold text-gray-800 mb-6 text-center">Get in Touch</h3>
        <form action="#" method="POST" class="space-y-4">
            <div>
                <label class="form-label">Name</label>
                <input type="text" name="name" class="auth-input" placeholder="Your Name" required>
            </div>
            <div>
                <label class="form-label">Email</label>
                <input type="email" name="email" class="auth-input" placeholder="your@email.com" required>
            </div>
            <div>
                <label class="form-label">Message</label>
                <textarea name="message" class="auth-input h-32" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-full">Send Message</button>
        </form>
    </div>
    
    <div class="mt-8 grid grid-cols-3 gap-4 text-center">
        <div class="card p-4">
            <i class="fas fa-envelope text-brand-teal text-2xl mb-2"></i>
            <p class="text-sm font-bold">Email</p>
            <p class="text-xs text-gray-500">support@safi.app</p>
        </div>
        <div class="card p-4">
            <i class="fas fa-phone text-brand-teal text-2xl mb-2"></i>
            <p class="text-sm font-bold">Phone</p>
            <p class="text-xs text-gray-500">+20 100 000 0000</p>
        </div>
        <div class="card p-4">
            <i class="fas fa-map-marker-alt text-brand-teal text-2xl mb-2"></i>
            <p class="text-sm font-bold">Location</p>
            <p class="text-xs text-gray-500">Giza, Egypt</p>
        </div>
    </div>
</div>
{% endblock %}
