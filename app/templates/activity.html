{% extends "base.html" %}

{% block title %}Safi - Notification{% endblock %}

{% block header %}
<header class="page-header">
    <h2 class="page-title">All Notification</h2>
</header>
{% endblock %}

{% block content %}
<div class="card">
    <div class="feed-list">
        <div class="feed-item cursor-pointer hover:bg-gray-50 transition" onclick="showNotificationDetails('Omar added expense Gas Station (200 EGP)')">
            <div class="flex justify-between items-center w-full">
                <div class="flex gap-4 items-center">
                    <div class="w-10 h-10 bg-teal-100 rounded-full flex items-center justify-center text-brand-teal shrink-0">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div>
                        <p class="text-sm font-bold text-gray-900">Omar added expense "Gas Station"</p>
                        <p class="text-muted-sm">2 hours ago</p>
                    </div>
                </div>
                <button onclick="event.stopPropagation(); markAsRead(this)" class="text-xs text-gray-500 hover:text-brand-teal border border-gray-200 px-3 py-1 rounded transition-colors bg-white">
                    Mark Read
                </button>
            </div>
        </div>

        <div class="feed-item cursor-pointer hover:bg-gray-50 transition" onclick="showInvitation('Dahab Trip 2025')">
            <div class="flex justify-between items-center w-full">
                <div class="flex gap-4 items-center">
                    <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 shrink-0">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div>
                        <p class="text-sm font-bold text-gray-900">Invited to "Dahab Trip 2025"</p>
                        <p class="text-muted-sm">Just now</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="event.stopPropagation(); rejectInvite(this)" class="text-xs text-red-500 hover:bg-red-50 border border-red-200 px-3 py-1 rounded transition-colors bg-white">Reject</button>
                    <button onclick="event.stopPropagation(); acceptInvite(this)" class="text-xs text-green-500 hover:bg-green-50 bg-brand-teal px-3 py-1 rounded hover:opacity-90 border border-brand-teal">Accept</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
