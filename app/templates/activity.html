{% extends "base.html" %}

{% block title %}Safi - Activity{% endblock %}

{% block header %}
<header class="page-header">
    <h2 class="page-title">Activity Log</h2>
</header>
{% endblock %}

{% block content %}
<div class="card space-y-6">
    <div class="flex gap-4 items-center border-b border-gray-100 pb-4">
        <div class="w-10 h-10 bg-teal-100 rounded-full flex items-center justify-center text-brand-teal shrink-0">
            <i class="fas fa-receipt"></i>
        </div>
        <div>
            <p class="text-sm font-bold text-gray-900">Omar added expense "Gas Station"</p>
            <p class="text-muted-sm">2 hours ago in <span class="text-blue-500">Dahab Trip</span></p>
        </div>
    </div>

    <div class="flex gap-4 items-center border-b border-gray-100 pb-4">
        <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600 shrink-0">
            <i class="fas fa-check"></i>
        </div>
        <div>
            <p class="text-sm font-bold text-gray-900">You settled 120 EGP with Osama</p>
            <p class="text-muted-sm">Yesterday in <span class="text-blue-500">Roommates</span></p>
        </div>
    </div>
</div>
{% endblock %}
